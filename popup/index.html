<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceHunt — Сравнение цен</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="popup">
    <h1>Сравнение цен</h1>
    <p class="loading" id="loading">Ищем лучшие цены…</p>
    <section class="results" aria-live="polite">
      <ul class="result-list" id="price-list">
        <!-- Результаты подставляются скриптом popup.js -->
      </ul>
    </section>
    <div class="actions">
      <button id="scan" type="button">Сканировать</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
