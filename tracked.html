<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Отслеживаемые товары Ozon</title>
    <link rel="stylesheet" href="tracked.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Все отслеживаемые товары</h1>
        <p>Здесь можно просмотреть историю цен, средние значения и удалить позиции.</p>
      </div>
      <button id="refresh-page">Обновить сейчас</button>
    </header>
    <main>
      <section>
        <p class="info">
          Данные хранятся в локальном файле расширения и не удаляются при очистке памяти браузера.
        </p>
      </section>
      <section>
        <ul id="tracked-list" class="tracked-list"></ul>
        <p id="tracked-empty" class="info">Вы ещё не добавили ни одного товара.</p>
      </section>
    </main>
    <template id="tracked-item-template">
      <li class="tracked-item">
        <div class="item-header">
          <div>
            <p class="item-title"></p>
            <a class="item-link" target="_blank" rel="noreferrer noopener">Открыть страницу</a>
          </div>
          <div class="item-stats">
            <div>
              <span>Текущая</span>
              <strong class="stat-current"></strong>
            </div>
            <div>
              <span>Средняя</span>
              <strong class="stat-average"></strong>
            </div>
            <div>
              <span>Порог</span>
              <strong class="stat-target"></strong>
            </div>
          </div>
          <button class="item-remove">Удалить</button>
        </div>
        <canvas class="chart" width="600" height="200"></canvas>
      </li>
    </template>
    <script type="module" src="tracked.js"></script>
  </body>
</html>
